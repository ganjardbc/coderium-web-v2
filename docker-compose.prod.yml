services:
  postgres:
    image: postgres:16-alpine
    container_name: coderium-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-coderium}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
      build:
        context: .
        dockerfile: apps/api/Dockerfile
      container_name: coderium-api-prod
      restart: always
      depends_on:
        postgres:
          condition: service_healthy
      environment:
        DATABASE_URL: ${DATABASE_URL}
        PORT: 3031
        NODE_ENV: production
        JWT_SECRET: ${JWT_SECRET}
        JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
        CORS_ORIGIN: "https://coderium.id,https://www.coderium.id,https://admin.coderium.id,http://localhost,http://localhost:5174"
      ports:
        - "3031:3031"
      volumes:
        - api_uploads:/app/uploads
      networks:
        - default
        - nginx-proxy-manager

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: coderium-admin-prod
    restart: always
    ports:
      - "5175:5175"
    networks:
      - default
      - nginx-proxy-manager

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: coderium-web-prod
    restart: always
    environment:
      PORT: 5174
      NODE_ENV: production
      NUXT_PUBLIC_API_BASE: "https://api.coderium.id/api/v1"
    ports:
      - "8082:5174"
    networks:
      - default
      - nginx-proxy-manager

volumes:
  postgres_prod_data:
  api_uploads:

networks:
  nginx-proxy-manager:
    external: true
    name: nginx-proxy-manager_default
